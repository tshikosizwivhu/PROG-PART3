name: CI - Build and Test

on:
  push:
  pull_request:

jobs:
  part2-api:
    name: Part 2 - build API and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.sln --configuration Release --no-build --verbosity normal

  part3-mvc:
    name: Part 3 - build API and MVC app, run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies (API, MVC and tests)
        run: dotnet restore Part3-MVC/RaceDay.sln

      - name: Build (API and MVC)
        run: dotnet build Part3-MVC/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part3-MVC/RaceDay.sln --configuration Release --no-build --verbosity normal

  part3-docker:
    name: Part 3 - build Docker images
    runs-on: ubuntu-latest
    needs: part3-mvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC image
        run: docker build -t raceday-web ./Part3-MVC/RaceDay.Web

      - name: Build API image
        run: docker build -t raceday-api ./Part3-MVC/RaceDay.Api
