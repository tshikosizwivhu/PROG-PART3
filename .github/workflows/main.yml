name: CI - Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API and MVC app, run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies (API, MVC and tests)
        run: dotnet restore RaceDay.sln

      - name: Build (API and MVC)
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC image
        run: docker build -t raceday-web ./RaceDay.Web

      - name: Build API image
        run: docker build -t raceday-api ./RaceDay.Api
